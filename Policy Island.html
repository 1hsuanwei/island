<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Policy Island</title>
<style>
/* Design tokens: UI panels adapt to the viewer's theme; the 3D scene has its own day/night cycle */
:root{
  --panel:rgba(16,22,40,.78); --panel-line:rgba(255,255,255,.14);
  --ink:#f2f4fa; --ink-soft:#aab3c8; --accent:#7fd0ff; --accent-ink:#06121f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(16,22,40,.78);--ink:#f2f4fa;}}
:root[data-theme="dark"]{--panel:rgba(16,22,40,.78);--ink:#f2f4fa;}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--panel:rgba(255,255,255,.82);--panel-line:rgba(10,20,40,.15);--ink:#14203a;--ink-soft:#4a5672;--accent:#0b5cad;--accent-ink:#fff;}}
html,body{height:100%;margin:0;background:#0a1233;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.panel{position:absolute;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
header.panel{top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;padding:12px 16px;max-width:min(320px,calc(100% - 28px))}
header h1{margin:0;font-size:20px;font-weight:700}
header p{margin:2px 0 0;color:var(--ink-soft);font-size:13px}
nav.panel{top:calc(env(safe-area-inset-top,0px) + 96px);left:14px;padding:8px;display:flex;flex-direction:column;gap:2px;max-height:calc(100% - 260px);overflow-y:auto}
nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);font:inherit;padding:8px 10px;min-height:44px;border-radius:8px;cursor:pointer;text-align:left}
nav button:hover,nav button[aria-current="true"]{background:rgba(127,160,255,.18)}
nav i{width:14px;height:14px;border-radius:4px;flex:none}
.controls{left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.controls label{display:flex;align-items:center;gap:10px;font-size:14px}
.controls input[type=range]{width:min(220px,40vw);min-height:44px;accent-color:var(--accent)}
button.primary{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
button.primary[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#popup{top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:min(340px,calc(100% - 28px));padding:18px 20px}
#popup[hidden]{display:none}
#popup h2{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--ink-soft)}
#popup p.policy{margin:0 0 10px;font-size:20px;font-weight:700;line-height:1.25}
#popup p.body{margin:0;color:var(--ink-soft)}
#popup a{display:inline-block;margin-top:12px;min-height:44px;line-height:44px;color:var(--accent);font-weight:600}
#popup a[hidden]{display:none}
#popup .swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
#popup .close{position:absolute;top:6px;right:6px;width:44px;height:44px;background:none;border:0;color:var(--ink);font-size:22px;cursor:pointer}
@media (max-width:640px){nav.panel{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive 3D map of policy islands"></canvas>

<header class="panel">
  <h1>Policy Island</h1>
  <p>Hover an island to lift it. Select one to read its policy.</p>
</header>

<nav class="panel" id="legend" aria-label="Policy categories"></nav>

<aside class="panel" id="popup" role="dialog" aria-labelledby="popup-cat" hidden>
  <button class="close" id="popup-close" aria-label="Close policy details">&times;</button>
  <h2 id="popup-cat"></h2>
  <p class="policy" id="popup-policy"></p>
  <p class="body" id="popup-body"></p>
  <a id="popup-link" href="#" target="_blank" rel="noopener noreferrer" hidden>閱讀《金剛經》電子書</a>
</aside>

<section class="panel controls" aria-label="Scene controls">
  <button class="primary" id="toggle-lines" aria-pressed="false">Toggle Collaboration Lines</button>
  <label>Time of day
    <input type="range" id="time" min="0" max="1" step="0.001" value="0" aria-label="Time of day, dawn to night">
  </label>
  <label><input type="checkbox" id="auto"> Auto cycle</label>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

'use strict';

/* ---------- 1. Data: islands on an axial hex grid (q, r) ---------- */
const ISLANDS = [
  { id:'tech',      name:'金牛',        color:0x3d7bff, scale:4, q:0,  r:0,  deco:'tower',  policy:'Policy #01: Smart AI Classrooms',        text:'Placeholder: AI tutoring tools and shared compute for every public school.' },
  { id:'green',     name:'金剛經',     color:0x5ee6b0, link:'https://sutra.ddm.org.tw/ebook/10/', push:4.2, q:1,  r:0,  deco:'trees',  policy:'Policy #02: Urban Forest Corridors',     text:'Placeholder: connected tree-lined paths and rooftop gardens across districts.' },
  { id:'education', name:'艋舺龍山寺',          color:0xb48cff, link:'https://sutra.ddm.org.tw/ebook/10/', scale:2, push:6, q:-1, r:0,  deco:'temple', policy:'Policy #03: Lifelong Learning Accounts', text:'Placeholder: a learning credit for residents at every stage of life.' },
  { id:'family',    name:'日本',        color:0xffb27a, push:4.2, q:0,  r:1,  deco:'houses', policy:'Policy #04: Flexible Childcare Network', text:'Placeholder: neighbourhood childcare hubs with extended opening hours.' },
  { id:'transport', name:'韓國',     color:0xffd35e, push:4.2, q:-1, r:1,  deco:'road',   policy:'Policy #05: Seamless Transit Pass',      text:'Placeholder: one pass for buses, rail and shared bikes.' },
  { id:'health',    name:'中央銀行',      color:0xff7aa8, push:4.2, q:0,  r:-1, deco:'bank', policy:'Policy #06: Community Clinics',          text:'Placeholder: walk-in primary care within fifteen minutes of home.' },
  { id:'culture',   name:'Culture and Tourism',color:0xff8a6a, push:4.2, q:1,  r:-1, deco:'blocks', policy:'Policy #07: Night Market Revival',       text:'Placeholder: protected cultural districts and evening events.' },
  { id:'housing',   name:'惡魔島',            color:0xb8e65e, q:2,  r:-1, deco:'wild', policy:'Policy #08: Social Housing Quota',       text:'Placeholder: a share of every new development reserved for affordable homes.' },
  { id:'economy',   name:'Digital Economy',    color:0x4fd8e8, q:-1, r:2,  deco:'tower',  policy:'Policy #09: Startup Sandbox',            text:'Placeholder: a regulatory sandbox for small digital businesses.' }
];
// Cross-departmental collaboration pairs
const LINKS = [['education','family'],['tech','education'],['tech','green'],['green','transport'],

/* ---------- 2. Renderer, scene, camera, controls ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7fb8b4);
scene.fog = new THREE.Fog(0x7fb8b4, 50, 120);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
camera.position.set(27, 31, 36);

const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.enablePan = false;
// Keep an isometric, tactical angle
controls.minPolarAngle = 0.7; controls.maxPolarAngle = 1.1;
controls.minDistance = 10;    controls.maxDistance = 75;

/* ---------- 3. Lights ---------- */
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
const sun = new THREE.DirectionalLight(0xffb86b, 1.1);
scene.add(ambient, sun);

/* ---------- 4. Ocean: plane with sine-wave vertex animation ---------- */
const OCEAN_BASE = new THREE.Color(0x14608a);
const oceanGeo = new THREE.PlaneGeometry(200, 200, 100, 100);
oceanGeo.rotateX(-Math.PI / 2);
const ocean = new THREE.Mesh(oceanGeo, new THREE.MeshStandardMaterial({ color:OCEAN_BASE, flatShading:true, roughness:.35, metalness:.1 }));
scene.add(ocean);
const oceanPos = oceanGeo.attributes.position;

/* ---------- 5. Islands ---------- */
const R = 2.2, H = 0.8, GAP = 1.75;
const islands = [];            // { data, group, body, hover, emi }
const hitTargets = [];         // every mesh the raycaster tests
const world = new THREE.Group();
scene.add(world);

// Pointy hexagon (vertex toward +z), so neighbours sit at sqrt(3)*R spacing
function hexToWorld(q, r) {
  return new THREE.Vector3(R * Math.sqrt(3) * (q + r / 2) * GAP, 0, R * 1.5 * r * GAP);
}
const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color:c, flatShading:true, roughness:.8 }, o));

/* --- Procedural decorations (all positioned relative to the island top) --- */
function addTrees(g) {
  const spots = [[-1.2,-.4],[-.2,-1.3],[1.2,-.5],[-.6,1.2],[.9,1.0]];   // trees sit in a ring, leaving the centre for the book
  spots.forEach(([x, z], i) => {
    const s = 0.8 + (i % 3) * 0.2, tree = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.08, .1, .4, 6), mat(0x6b4a2e));
    trunk.position.y = .2;
    const crown = new THREE.Mesh(new THREE.ConeGeometry(.4, .9, 6), mat(0x1f9d62));
    crown.position.y = .85;
    tree.add(trunk, crown); tree.scale.setScalar(s); tree.position.set(x, H, z);
    g.add(tree);
  });
}

function addMediaTekSign(g, bx, bz, bw) {
  const tex = new THREE.TextureLoader().load(MEDIATEK_LOGO);
  tex.anisotropy = 4;
  const sm = new THREE.MeshBasicMaterial({ map:tex, transparent:true, alphaTest:.3 });   // unlit and bright; the circle's corners are transparent
  const w = bw * .9, y = H + 1.3, off = bw / 2 + .01;
  const front = new THREE.Mesh(new THREE.PlaneGeometry(w, w), sm);
  front.position.set(bx, y, bz + off);
  front.userData.bookLink = MEDIATEK_URL;                              // the clones inherit this
  const right = front.clone(); right.rotation.y = Math.PI / 2;  right.position.set(bx + off, y, bz);
  const back  = front.clone(); back.rotation.y = Math.PI;       back.position.set(bx, y, bz - off);
  const left  = front.clone(); left.rotation.y = -Math.PI / 2;  left.position.set(bx - off, y, bz);
  g.add(front, right, back, left);
}

function addFoxconnSign(g, bx, bz, bw) {
  const tex = new THREE.TextureLoader().load(FOXCONN_LOGO);
  tex.anisotropy = 4;
  const sm = new THREE.MeshBasicMaterial({ map:tex });                 // unlit and bright
  const w = bw * .96, hh = w * 216 / 800, y = H + 1.25, off = bw / 2 + .01;   // keep the logo's aspect ratio
  const front = new THREE.Mesh(new THREE.PlaneGeometry(w, hh), sm);
  front.position.set(bx, y, bz + off);
  front.userData.bookLink = FOXCONN_URL;                               // the clones inherit this
  const right = front.clone(); right.rotation.y = Math.PI / 2;  right.position.set(bx + off, y, bz);
  const back  = front.clone(); back.rotation.y = Math.PI;       back.position.set(bx, y, bz - off);
  const left  = front.clone(); left.rotation.y = -Math.PI / 2;  left.position.set(bx - off, y, bz);
  g.add(front, right, back, left);
}

function addDeltaSign(g, bx, bz, bw) {
  const tex = new THREE.TextureLoader().load(DELTA_LOGO);
  tex.anisotropy = 4;
  const sm = new THREE.MeshBasicMaterial({ map:tex });                 // unlit and bright
  const w = bw * .9, y = H + 1.0, off = bw / 2 + .01;
  const front = new THREE.Mesh(new THREE.PlaneGeometry(w, w), sm);
  front.position.set(bx, y, bz + off);
  front.userData.bookLink = DELTA_URL;                                 // the clones inherit this
  const right = front.clone(); right.rotation.y = Math.PI / 2;  right.position.set(bx + off, y, bz);
  const back  = front.clone(); back.rotation.y = Math.PI;       back.position.set(bx, y, bz - off);
  const left  = front.clone(); left.rotation.y = -Math.PI / 2;  left.position.set(bx - off, y, bz);
  g.add(front, right, back, left);
}

  const sm = new THREE.MeshBasicMaterial({ map:tex });                 // unlit and bright
  const w = bw * .96, hh = w * 281 / 800, y = H + .95, off = bw / 2 + .01;   // keep the logo's aspect ratio
  const front = new THREE.Mesh(new THREE.PlaneGeometry(w, hh), sm);
  front.position.set(bx, y, bz + off);
  front.userData.bookLink = ASE_URL;                                   // the clones inherit this
  const right = front.clone(); right.rotation.y = Math.PI / 2;  right.position.set(bx + off, y, bz);
  const back  = front.clone(); back.rotation.y = Math.PI;       back.position.set(bx, y, bz - off);
  const left  = front.clone(); left.rotation.y = -Math.PI / 2;  left.position.set(bx - off, y, bz);
  g.add(front, right, back, left);
}

function addNanYaSign(g, bx, bz, bw) {
  const tex = new THREE.TextureLoader().load(NANYA_LOGO);
  tex.anisotropy = 4;
  const sm = new THREE.MeshBasicMaterial({ map:tex });                 // unlit and bright
  const w = bw * .96, hh = w * 400 / 600, y = H + .8, off = bw / 2 + .01;   // keep the logo's aspect ratio
  const front = new THREE.Mesh(new THREE.PlaneGeometry(w, hh), sm);
  front.position.set(bx, y, bz + off);
  front.userData.bookLink = NANYA_URL;                                 // the clones inherit this
  const right = front.clone(); right.rotation.y = Math.PI / 2;  right.position.set(bx + off, y, bz);
  const back  = front.clone(); back.rotation.y = Math.PI;       back.position.set(bx, y, bz - off);
  const left  = front.clone(); left.rotation.y = -Math.PI / 2;  left.position.set(bx - off, y, bz);
  g.add(front, right, back, left);
}

function makeBankFacade() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#aaa59d'; x.fillRect(0, 0, 256, 256);              // stone wall
  for (let i = 0; i < 16; i++) {                                    // tall dark slits between pale vertical fins
    x.fillStyle = '#4b4742'; x.fillRect(10 + i * 15.2, 18, 6, 224);
    x.fillStyle = '#c4bfb6'; x.fillRect(10 + i * 15.2 + 6, 18, 2, 224);
  }
  return new THREE.CanvasTexture(c);
}
function addBank(g) {
  const bank = new THREE.Group();
  const stone = mat(0xb9b4ab), cap = mat(0xc9c4bb);
  const add = (m, x, y, z) => { m.position.set(x, y, z); bank.add(m); return m; };
  // Podium
  add(new THREE.Mesh(new THREE.BoxGeometry(2.6, .5, 2.2), stone), 0, H + .25, 0);
  // Main block: the wall texture goes on the four sides, plain stone on top and bottom
  const wall = new THREE.MeshStandardMaterial({ map:makeBankFacade(), roughness:.9 });
  add(new THREE.Mesh(new THREE.BoxGeometry(1.9, 2.0, 1.5), [wall, wall, cap, cap, wall, wall]), 0, H + 1.5, 0);
  // Stepped top and antenna
  add(new THREE.Mesh(new THREE.BoxGeometry(1.7, .15, 1.3), cap), 0, H + 2.575, 0);
  add(new THREE.Mesh(new THREE.BoxGeometry(1.1, .2, .8), stone), 0, H + 2.75, 0);
  add(new THREE.Mesh(new THREE.CylinderGeometry(.015, .035, .6, 5), mat(0x8a8f99)), .5, H + 3.15, 0);
  // Emblem medallions on all four faces of the main block (unlit, so they stay bright; the circle's corners are transparent)
  const tex = new THREE.TextureLoader().load(BANK_LOGO);
  tex.anisotropy = 4;
  const sm = new THREE.MeshBasicMaterial({ map:tex, transparent:true, alphaTest:.3 });
  const d = .62, y = H + 1.55;
  const front = add(new THREE.Mesh(new THREE.PlaneGeometry(d, d), sm), 0, y, .76);
  const back  = add(new THREE.Mesh(new THREE.PlaneGeometry(d, d), sm), 0, y, -.76); back.rotation.y = Math.PI;
  const right = add(new THREE.Mesh(new THREE.PlaneGeometry(d, d), sm), .96, y, 0);  right.rotation.y = Math.PI / 2;
  const left  = add(new THREE.Mesh(new THREE.PlaneGeometry(d, d), sm), -.96, y, 0); left.rotation.y = -Math.PI / 2;
  g.add(bank);
  bank.traverse(m => { m.userData.bookLink = BANK_URL; });          // clicking the building opens the exchange-rate page
}

function makeCitiFlagTexture() {
  const c = document.createElement('canvas'); c.width = 600; c.height = 400;
  const x = c.getContext('2d');
  x.fillStyle = '#0a5cab'; x.fillRect(0, 0, 600, 400);                       // blue field
  x.strokeStyle = '#e31837'; x.lineWidth = 14; x.lineCap = 'round';          // red arc over the lettering
  x.beginPath(); x.arc(300, 330, 260, Math.PI * 1.22, Math.PI * 1.78); x.stroke();
  x.fillStyle = '#ffffff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = 'bold 110px "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
  x.fillText('花旗銀行', 300, 175);
  x.font = 'bold 84px Arial, Helvetica, sans-serif';
  x.fillText('citibank', 300, 290);
  return new THREE.CanvasTexture(c);
}
function addCitiFlag(g, px, pz) {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, 2.0, 6), mat(0xdddddd));
  pole.position.set(px, H + 1.0, pz);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 6), mat(0xe8b923));
  knob.position.set(px, H + 2.02, pz);
  const geo = new THREE.PlaneGeometry(1.2, .8, 12, 6);
  geo.translate(.6, 0, 0);                                    // hinge on the left edge (animated in the render loop)
  const cloth = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map:makeCitiFlagTexture(), side:THREE.DoubleSide }));
  cloth.position.set(px, H + 1.55, pz);
  const fg = new THREE.Group(), s = .8;
  fg.add(pole, knob, cloth);
  fg.scale.setScalar(s);
  fg.position.set((1 - s) * px, (1 - s) * H, (1 - s) * pz);   // keep the foot of the pole in place
  fg.traverse(m => { m.userData.bookLink = CITI_URL; });          // clicking the flag opens this link
  g.add(fg);
  g.userData.flag = geo;
}
// Animal helpers: every animal is built facing +x with its feet on y = 0, then placed on the island
const blk = (w, h, d, color, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color)); m.position.set(x, y, z); return m; };
const spike = (r, h, color, x, y, z, rx = 0, rz = 0) => { const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 4), mat(color)); m.position.set(x, y, z); m.rotation.set(rx, 0, rz); return m; };
function place(g, parts, x, z, rot, link) {
  const a = new THREE.Group();
  parts.forEach(p => a.add(p));
  a.position.set(x, H, z); a.rotation.y = rot;
  a.userData.baseRot = rot; a.userData.phase = x * 3 + z;       // used for a slow idle sway
  a.traverse(m => { m.userData.bookLink = link; });               // clicking the animal opens its link
  g.add(a);
  (g.userData.idle = g.userData.idle || []).push(a);
}

// A tall, steep, green low-poly mountain with small trees on its slopes and at its foot
function addMountain(g, x, z) {
  const m = new THREE.Group();
  const tree = (px, py, pz, s) => {
    const t = new THREE.Group();
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(.08, .1, .4, 6), mat(0x6b4a2e)); stem.position.y = .2;
    const crown = new THREE.Mesh(new THREE.ConeGeometry(.4, .9, 6), mat(0x1f5f35)); crown.position.y = .85;
    t.add(stem, crown);
    t.scale.setScalar(s); t.position.set(px, py, pz);
    m.add(t);
  };
  const peaks = [                                              // radius, height, offset, colour (lighter green for the biggest)
    { r:.7,  h:2.4, x:0,   z:0,  c:0x5aa860 },
    { r:.45, h:1.5, x:.5,  z:0,  c:0x4f9a56 },
    { r:.35, h:1.0, x:-.5, z:.1, c:0x66b06a }
  ];
  peaks.forEach((p, i) => {
    const cone = new THREE.Mesh(new THREE.ConeGeometry(p.r, p.h, 6), mat(p.c));
    cone.position.set(p.x, p.h / 2, p.z);
    cone.rotation.y = i * .5;
    m.add(cone);
    const n = [8, 4, 3][i];                                    // little trees spiralling up the slope
    for (let k = 0; k < n; k++) {
      const ang = k / n * Math.PI * 2 + i, d = p.r * (.28 + (k % 3) * .17);
      const y = Math.max(0, p.h * (1 - d / (p.r * .93)));     // height of the slope at that distance from the peak
      tree(p.x + Math.cos(ang) * d, y, p.z + Math.sin(ang) * d, [.26, .22, .18][i]);
    }
  });
  tree(.35, 0, -.8, .3); tree(1.0, 0, .35, .28);               // two trees on the flat ground at the foot
  m.position.set(x, H, z);
  g.add(m);
}

// Tech island downtown: the tallest tower (with the signs) and a second tower now stand apart, with eight more buildings around them
const CITY = [   // x, z, width, height, colour
  [-1.0, .55, .45, 1.5, 0x7fc8ff], [.95, -.85, .5, 1.8, 0x8fd6ff], [0, 1.2, .45, .9, 0x6fb8ff], [0, -1.25, .5, 1.3, 0x9fe4ff],
  [-1.5, 0, .4, 1.0, 0x6fb8ff],    [1.5, -.1, .4, 1.1, 0x7fc8ff],  [-.55, -.7, .4, .7, 0x8fd6ff], [.55, .6, .4, .6, 0x6fb8ff]
];
function addCity(g, link) {
  const main = new THREE.Mesh(new THREE.BoxGeometry(.7, 2.4, .7), new THREE.MeshBasicMaterial({ color:0x9fe4ff }));
  main.position.y = H + 1.2;
  const side = new THREE.Mesh(new THREE.BoxGeometry(.5, 1.2, .5), new THREE.MeshBasicMaterial({ color:0x6fb8ff }));
  side.position.set(1.05, H + .6, .9);                    // moved away from the main tower
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.2, .12, 1.2), mat(0x1c2a4a));
  base.position.y = H + .06;
  main.userData.bookLink = link; side.userData.bookLink = ASE_URL;      // clicking these two opens the link
  g.add(main, side, base);
  addAseSign(g, 1.05, .9, .5);                              // the second tower is the fifth-tallest building
  CITY.forEach(([x, z, w, h, c], i) => {                      // the eight extra buildings glow softly and are lit a little, so their faces differ
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), mat(c, { emissive:c, emissiveIntensity:.55 }));
    b.position.set(x, H + h / 2, z);
    g.add(b);
    if (i === 1) { b.userData.bookLink = MEDIATEK_URL; addMediaTekSign(g, x, z, w); }   // second-tallest building
    if (i === 0) { b.userData.bookLink = FOXCONN_URL; addFoxconnSign(g, x, z, w); }          // third-tallest building
    if (i === 3) { b.userData.bookLink = DELTA_URL; addDeltaSign(g, x, z, w); }              // fourth-tallest building
    if (i === 5) { b.userData.bookLink = NANYA_URL; addNanYaSign(g, x, z, w); }              // sixth-tallest building
  });
}
function addTower(g, link = null) {
  // MeshBasicMaterial ignores lighting, so it keeps glowing at night
  const glow = new THREE.MeshBasicMaterial({ color:0x9fe4ff });
  const main = new THREE.Mesh(new THREE.BoxGeometry(.7, 2.4, .7), glow);
  main.position.y = H + 1.2;
  const side = new THREE.Mesh(new THREE.BoxGeometry(.5, 1.2, .5), new THREE.MeshBasicMaterial({ color:0x6fb8ff }));
  side.position.set(.8, H + .6, .3);
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.6, .12, 1.6), mat(0x1c2a4a));
  base.position.y = H + .06;
  main.userData.bookLink = link; side.userData.bookLink = link;      // clicking the building opens this link
  g.add(main, side, base);
}
// Thread-bound book cover with the title written vertically, drawn on a canvas
function makeCoverTexture(title, cover) {
  const c = document.createElement('canvas'); c.width = 360; c.height = 480;
  const x = c.getContext('2d');
  x.fillStyle = cover; x.fillRect(0, 0, 360, 480);
  x.strokeStyle = '#c9a85a'; x.lineWidth = 4; x.strokeRect(14, 14, 332, 452);
  x.fillStyle = '#c9a85a';                                  // stitching along the spine (left edge)
  for (let y = 60; y < 440; y += 60) { x.beginPath(); x.arc(34, y, 5, 0, 7); x.fill(); }
  x.fillStyle = '#f3ead2'; x.fillRect(135, 60, 120, 330);   // paper title label
  x.fillStyle = '#1c1c1c'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = 'bold 84px "Noto Serif TC", "PMingLiU", "Songti TC", serif';
  [...title].forEach((ch, i) => x.fillText(ch, 195, 125 + i * 100));
  return new THREE.CanvasTexture(c);
}
function addBook(g, x = 0, z = 0, s = 1, title = '金剛經', link = 'https://sutra.ddm.org.tw/ebook/10/', cover = 0x1f3a6e) {
  const base = new THREE.Mesh(new THREE.CylinderGeometry(.55, .65, .3, 6), mat(0xc9c2b4));   // stone stand
  base.position.y = H + .15;
  const blue = mat(cover);
  const pages = new THREE.Mesh(new THREE.BoxGeometry(.86, .1, 1.16), mat(0xf3ead2));
  pages.position.y = .05;
  // Box face order: +x, -x, +y (top), -y, +z, -z
  const top = new THREE.Mesh(new THREE.BoxGeometry(.9, .03, 1.2),
    [blue, blue, new THREE.MeshStandardMaterial({ map:makeCoverTexture(title, '#' + cover.toString(16).padStart(6, '0')), roughness:.8 }), blue, blue, blue]);
  top.position.y = .115;
  const bottom = new THREE.Mesh(new THREE.BoxGeometry(.9, .03, 1.2), blue);
  bottom.position.y = -.015;
  const book = new THREE.Group();
  book.rotation.order = 'YXZ';
  book.add(pages, top, bottom);
  book.scale.setScalar(1.1);
  const stand = new THREE.Group();                          // stand + book, scaled about the island surface
  stand.add(base, book);
  stand.scale.setScalar(s);
  stand.position.set(x, (1 - s) * H, z);
  g.add(stand);
  (g.userData.books = g.userData.books || []).push(book);
  book.traverse(m => { m.userData.isBook = true; m.userData.bookLink = link; });         // lets the click handler tell the book from the rest of the island
}

// Flag of the Republic of China (Taiwan), drawn on a canvas and used as a texture
function makeFlagTexture() {
  const c = document.createElement('canvas'); c.width = 600; c.height = 400;     // 3:2 ratio
  const x = c.getContext('2d');
  x.fillStyle = '#fe0000'; x.fillRect(0, 0, 600, 400);                           // red field
  x.fillStyle = '#000095'; x.fillRect(0, 0, 300, 200);                           // blue canton
  x.fillStyle = '#fff'; x.beginPath();                                           // white sun, 12 rays
  for (let i = 0; i < 24; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 12, rr = i % 2 ? 44 : 82;
    x[i ? 'lineTo' : 'moveTo'](150 + Math.cos(a) * rr, 100 + Math.sin(a) * rr);
  }
  x.closePath(); x.fill();
  x.fillStyle = '#000095'; x.beginPath(); x.arc(150, 100, 36, 0, 7); x.fill();   // blue ring
  x.fillStyle = '#fff'; x.beginPath(); x.arc(150, 100, 31, 0, 7); x.fill();      // white disc
  return new THREE.CanvasTexture(c);
}
function addFlag(g) {
  const px = -1.1, pz = -.8;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, 2.2, 6), mat(0xdddddd));
  pole.position.set(px, H + 1.1, pz);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 6), mat(0xe8b923));
  knob.position.set(px, H + 2.22, pz);
  const geo = new THREE.PlaneGeometry(1.2, .8, 12, 6);
  geo.translate(.6, 0, 0);                                // hinge the flag on its left edge
  const cloth = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map:makeFlagTexture(), side:THREE.DoubleSide }));
  cloth.position.set(px, H + 1.78, pz);
  // Shrink the whole flag, keeping the foot of the pole where it is
  const fg = new THREE.Group(), s = .3;
  fg.add(pole, knob, cloth);
  fg.scale.setScalar(s);
  fg.position.set((1 - s) * px, (1 - s) * H, (1 - s) * pz);
  g.add(fg);
  g.userData.flag = geo;
}

function addTsmcSign(g) {
  const tex = new THREE.TextureLoader().load(TSMC_LOGO);
  tex.anisotropy = 4;
  const sm = new THREE.MeshBasicMaterial({ map:tex });               // unlit, so the sign stays bright at night
  const w = .6, h = w * 397 / 503;                                     // keep the logo's aspect ratio
  const front = new THREE.Mesh(new THREE.PlaneGeometry(w, h), sm);
  front.position.set(0, H + 2.1, .36);
  front.userData.bookLink = TSMC_STOCK_URL;                            // the clones below inherit this
  const side = front.clone();
  side.rotation.y = Math.PI / 2; side.position.set(.36, H + 2.1, 0);
  const back = front.clone();
  back.rotation.y = Math.PI; back.position.set(0, H + 2.1, -.36);
  const left = front.clone();
  left.rotation.y = -Math.PI / 2; left.position.set(-.36, H + 2.1, 0);
  g.add(front, side, back, left);                                      // all four faces
}

  const p = new THREE.Group();
  const legs = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, .16, 6), mat(0x2b3550));
  legs.position.y = .08;
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(.1, .12, .26, 6), mat(0xffffff));
  torso.position.y = .29;
  const head = new THREE.Mesh(new THREE.SphereGeometry(.09, 8, 6), mat(0xf2c9a0));
  head.position.y = .5;
  const hat = new THREE.Mesh(new THREE.SphereGeometry(.1, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xffd23c));
  hat.position.y = .53;
  p.add(legs, torso, head, hat);
  p.scale.setScalar(1.4);
  p.position.set(0, H, -.65);
  p.rotation.y = -.6;
  g.add(p);
  g.userData.person = { mesh:p, target:p.position.clone(), wait:0 };
}
function addHouses(g, color) {
  [[-.7,-.3],[.5,-.6],[.4,.6]].forEach(([x, z], i) => {
    const h = new THREE.Group();
    const wall = new THREE.Mesh(new THREE.BoxGeometry(.6, .45, .6), mat(0xf4efe6));
    wall.position.y = .22;
    const roof = new THREE.Mesh(new THREE.ConeGeometry(.5, .35, 4), mat(color));
    roof.position.y = .62; roof.rotation.y = Math.PI / 4;
    h.add(wall, roof); h.position.set(x, H, z); h.rotation.y = i;
    g.add(h);
  });
}
function addBlocks(g, color, seed) {
  for (let i = 0; i < 4; i++) {
    const hgt = .5 + ((seed * 7 + i * 5) % 9) / 9 * 1.1;
    const b = new THREE.Mesh(new THREE.BoxGeometry(.5, hgt, .5), mat(color));
    const a = i * Math.PI / 2 + .6;
    b.position.set(Math.cos(a) * .8, H + hgt / 2, Math.sin(a) * .8);
    g.add(b);
  }
}
// Plaque (bian-e): black lacquered board, gold border and gold characters, drawn on a canvas
function makePlaqueTexture(text) {
  const c = document.createElement('canvas'); c.width = 850; c.height = 240;
  const x = c.getContext('2d');
  x.fillStyle = '#16110d'; x.fillRect(0, 0, 850, 240);
  x.strokeStyle = '#e8b84a'; x.lineWidth = 8; x.strokeRect(10, 10, 830, 220);
  x.fillStyle = '#e8b84a'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = 'bold 150px "Noto Serif TC", "PMingLiU", "Songti TC", serif';
  x.fillText(text, 425, 125, 760);
  return new THREE.CanvasTexture(c);
}

// Temple in the style of a Taiwanese temple: red hall, two tiers of golden hip roofs, columns, lanterns, incense burner
function addTemple(g) {
  const red = mat(0xc0392b), gold = mat(0xe0a526), roofMat = mat(0xd98e2b);
  const add = (m, x, y, z) => { m.position.set(x, y, z); g.add(m); return m; };
  // Stone platform
  add(new THREE.Mesh(new THREE.BoxGeometry(2.4, .15, 1.8), mat(0xc9c2b4)), 0, H + .075, 0);
  // Main hall
  add(new THREE.Mesh(new THREE.BoxGeometry(1.6, .6, 1.1), red), 0, H + .45, -.1);
  // Four front columns
  [-.7, -.25, .25, .7].forEach(x => add(new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .6, 6), red), x, H + .45, .6));
  // Lower roof (a square pyramid squashed to a rectangle)
  const lowGeo = new THREE.ConeGeometry(1.4, .5, 4); lowGeo.rotateY(Math.PI / 4);
  const low = add(new THREE.Mesh(lowGeo, roofMat), 0, H + 1.0, -.1); low.scale.set(1, 1, .72);
  // Upper hall and roof
  add(new THREE.Mesh(new THREE.BoxGeometry(.9, .35, .65), red), 0, H + 1.4, -.1);
  const upGeo = new THREE.ConeGeometry(.95, .45, 4); upGeo.rotateY(Math.PI / 4);
  const up = add(new THREE.Mesh(upGeo, roofMat), 0, H + 1.8, -.1); up.scale.set(1, 1, .72);
  // Plaque hung on the front of the upper hall
  const wood = mat(0x2a1d12);
  add(new THREE.Mesh(new THREE.BoxGeometry(.85, .24, .04),
    [wood, wood, wood, wood, new THREE.MeshStandardMaterial({ map:makePlaqueTexture('寺山龍 舺艋'), roughness:.6 }), wood]), 0, H + 1.4, .245);
  // Golden finial
  add(new THREE.Mesh(new THREE.ConeGeometry(.06, .3, 6), gold), 0, H + 2.15, -.1);
  // Red lanterns hanging at the front
  [-.55, .55].forEach(x => add(new THREE.Mesh(new THREE.SphereGeometry(.1, 8, 6), mat(0xff3b2f, { emissive:0xff3b2f, emissiveIntensity:.8 })), x, H + .6, .8));
  // Incense burner in the courtyard
  add(new THREE.Mesh(new THREE.CylinderGeometry(.14, .1, .2, 6), gold), 0, H + .25, 1.3);
}
function addRoad(g) {
  // Closed loop road with a bus (cube) driving along it
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-1.3,0,0), new THREE.Vector3(-.5,0,-1), new THREE.Vector3(.7,0,-.8),
    new THREE.Vector3(1.2,0,.3), new THREE.Vector3(.2,0,1), new THREE.Vector3(-.9,0,.8)], true);
  const road = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, .16, 4, true), mat(0x3a3f4a));
  road.scale.y = .12; road.position.y = H + .02;
  const bus = new THREE.Mesh(new THREE.BoxGeometry(.4, .22, .2), mat(0xff5a3c));
  g.add(road, bus);
  g.userData.bus = { mesh:bus, curve };
}

ISLANDS.forEach((d, i) => {
  const g = new THREE.Group();
  g.userData.index = i;
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(R, R * .92, H, 6),      // 6 radial segments = hexagon
    new THREE.MeshStandardMaterial({ color:d.color, emissive:d.color, emissiveIntensity:.1, flatShading:true, roughness:.7 })
  );
  body.position.y = H / 2;
  g.add(body);
  if (d.deco === 'trees') addTrees(g);
  if (d.id === 'green') addBook(g);
  if (d.deco === 'tower') { if (d.id === 'tech') addCity(g, TSMC_STOCK_URL); else addTower(g); }
  if (d.id === 'tech') addPerson(g);
  if (d.id === 'tech') addTsmcSign(g);
  if (d.id === 'tech') addFlag(g);
  if (d.deco === 'houses') addHouses(g, d.color);
  if (d.deco === 'temple') addTemple(g);
  if (d.deco === 'bank') addBank(g);
  if (d.deco === 'wild') addWild(g);
  if (d.id === 'education') addBook(g, 1.4, .5, .55);
  if (d.id === 'education') addBook(g, -1.4, .5, .55, '地藏經', 'https://sutra.ddm.org.tw/ebook/09/', 0x7a2e2e);   // Earth Store Sutra, maroon cover        // a smaller sutra book beside the temple
  if (d.deco === 'blocks') addBlocks(g, d.color, i);
  if (d.deco === 'road') addRoad(g);
  g.scale.setScalar(d.scale || 1);                       // some islands are bigger than others
  const hp = hexToWorld(d.q, d.r);
  if (d.push) hp.add(hp.clone().normalize().multiplyScalar(d.push));   // nudge big islands outward so they don't overlap their neighbours
  g.position.copy(hp);
  g.position.y = 0.3;                                    // floats above the water
  world.add(g);
  g.traverse(m => { if (m.isMesh) { m.userData.island = i; hitTargets.push(m); } });
  islands.push({ data:d, group:g, body, hover:false, lift:0, emi:.1 });
});

// Centre the cluster on the origin
const centroid = islands.reduce((v, o) => v.add(o.group.position), new THREE.Vector3()).divideScalar(islands.length);
world.position.set(-centroid.x, 0, -centroid.z);

/* ---------- 5b. Bridges between neighbouring islands ---------- */
const bridges = [];
const DIRS = [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];   // the six hex neighbours
const deckMat = mat(0xd9b07a), railMat = mat(0xf4efe6);
islands.forEach((a, i) => DIRS.forEach(([dq, dr]) => {
  const j = islands.findIndex(o => o.data.q === a.data.q + dq && o.data.r === a.data.r + dr);
  if (j <= i) return;                                    // no neighbour, or already built from the other side
  const b = islands[j];
  const hl = Math.hypot(b.group.position.x - a.group.position.x, b.group.position.z - a.group.position.z);
  const L = hl - 1.905 * (a.group.scale.x + b.group.scale.x) + .5;                         // gap between hex edges, plus a little overlap on each deck
  const br = new THREE.Group();
  br.rotation.order = 'YXZ';
  const deck = new THREE.Mesh(new THREE.BoxGeometry(.5, .08, L), deckMat);
  const railL = new THREE.Mesh(new THREE.BoxGeometry(.05, .14, L), railMat);
  railL.position.set(-.25, .1, 0);
  const railR = railL.clone(); railR.position.x = .25;
  br.add(deck, railL, railR);
  world.add(br);
  bridges.push({ br, a:a.group, b:b.group, hl });
}));

/* ---------- 6. Collaboration lines (curved tubes + travelling pulses) ---------- */
const linesGroup = new THREE.Group();
linesGroup.visible = false;
world.add(linesGroup);
const pulses = [];
LINKS.forEach(([a, b], i) => {
  const A = islands.find(o => o.data.id === a).group.position;
  const B = islands.find(o => o.data.id === b).group.position;
  const mid = A.clone().add(B).multiplyScalar(.5); mid.y = 3.4;
  const curve = new THREE.CatmullRomCurve3([A.clone().setY(1.4), mid, B.clone().setY(1.4)]);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, .045, 6, false),
    new THREE.MeshBasicMaterial({ color:0xfff1a8, transparent:true, opacity:.85, blending:THREE.AdditiveBlending, depthWrite:false }));
  const pulse = new THREE.Mesh(new THREE.SphereGeometry(.14, 8, 8), new THREE.MeshBasicMaterial({ color:0xffffff }));
  linesGroup.add(tube, pulse);
  pulses.push({ pulse, curve, offset:i / LINKS.length });
});

/* ---------- 7. Day/night cycle: dawn -> day -> dusk -> night ---------- */
const STOPS = [
  { bg:new THREE.Color(0x7fb8b4), sun:new THREE.Color(0xffb86b), i:1.1, amb:.45 },  // warm dawn
  { bg:new THREE.Color(0x2c9ad1), sun:new THREE.Color(0xffffff), i:1.5, amb:.65 },  // day
  { bg:new THREE.Color(0x4a7a99), sun:new THREE.Color(0xff9a6a), i:.9,  amb:.4  },  // dusk
  { bg:new THREE.Color(0x071a33), sun:new THREE.Color(0x5a78ff), i:.35, amb:.25 }   // midnight blue
];
const tmp = new THREE.Color();
function applyTime(phase) {
  const p = ((phase % 1) + 1) % 1 * STOPS.length, i = Math.floor(p), f = p - i;
  const A = STOPS[i % 4], B = STOPS[(i + 1) % 4];
  scene.background.copy(A.bg).lerp(B.bg, f);
  scene.fog.color.copy(scene.background);
  sun.color.copy(A.sun).lerp(B.sun, f);
  sun.intensity = A.i + (B.i - A.i) * f;
  ambient.intensity = A.amb + (B.amb - A.amb) * f;
  const ang = phase * Math.PI * 2;
  sun.position.set(Math.cos(ang) * 18, 13 + Math.sin(ang) * 4, Math.sin(ang) * 18);
  ocean.material.color.copy(OCEAN_BASE).lerp(tmp.copy(scene.background), .45);
}

/* ---------- 8. Interaction: raycasting, hover, click, camera focus ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pointerDirty = false, hovered = -1, selected = -1, downAt = null;
const focus = { active:false, target:new THREE.Vector3(), dist:30 };
const defaultTarget = new THREE.Vector3(0, 0, 0);

let lastHit = null;                       // mesh found by the latest pick()
function pick() {
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(hitTargets, false)[0];
  lastHit = hit ? hit.object : null;
  return hit ? hit.object.userData.island : -1;
}
function setPointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
canvas.addEventListener('pointermove', e => { setPointer(e); pointerDirty = true; });
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  // Treat as a click only if the pointer barely moved (otherwise it was an orbit drag)
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  setPointer(e);
  const idx = pick();
  if (idx >= 0) {
    select(idx);
    // Clicking the sutra book itself opens the e-book in a new tab
    if (lastHit.userData.bookLink) window.open(lastHit.userData.bookLink, '_blank', 'noopener');
  }
});
controls.addEventListener('start', () => { focus.active = false; });   // user takes over the camera

const popup = document.getElementById('popup');
function select(i) {
  selected = i;
  const o = islands[i], d = o.data;
  document.getElementById('popup-cat').innerHTML = '<span class="swatch" style="background:#' + d.color.toString(16).padStart(6, '0') + '"></span>' + d.name;
  document.getElementById('popup-policy').textContent = d.policy;
  document.getElementById('popup-body').textContent = d.text;
  const link = document.getElementById('popup-link');       // optional external link (shown as a fallback if pop-ups are blocked)
  link.hidden = !d.link;
  if (d.link) link.href = d.link;
  popup.hidden = false;
  focus.target.copy(o.group.position).add(world.position);
  focus.dist = 15 * Math.max(1, o.group.scale.x * .6); focus.active = true;
  legendButtons.forEach((b, k) => b.setAttribute('aria-current', k === i ? 'true' : 'false'));
}
function closePopup() {
  popup.hidden = true; selected = -1;
  focus.target.copy(defaultTarget); focus.dist = 52; focus.active = true;
  legendButtons.forEach(b => b.setAttribute('aria-current', 'false'));
}
document.getElementById('popup-close').addEventListener('click', closePopup);
addEventListener('keydown', e => { if (e.key === 'Escape' && selected >= 0) closePopup(); });

// Keyboard-friendly legend that mirrors the 3D islands
const legend = document.getElementById('legend');
const legendButtons = ISLANDS.map((d, i) => {
  const b = document.createElement('button');
  b.innerHTML = '<i style="background:#' + d.color.toString(16).padStart(6, '0') + '"></i>' + d.name;
  b.addEventListener('click', () => select(i));
  legend.appendChild(b);
  return b;
});

/* ---------- 9. Controls (DOM) ---------- */
const toggleBtn = document.getElementById('toggle-lines');
toggleBtn.addEventListener('click', () => {
  linesGroup.visible = !linesGroup.visible;
  toggleBtn.setAttribute('aria-pressed', String(linesGroup.visible));
});
const timeInput = document.getElementById('time'), autoInput = document.getElementById('auto');
let phase = 0;
timeInput.addEventListener('input', () => { phase = parseFloat(timeInput.value); });
autoInput.checked = !matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 10. Resize + render loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// Wave height at a world position: three crossing swells give rolling, uneven waves
function waveH(x, z, t) {
  return Math.sin(x * .28 + t * 1.1) * .35 + Math.sin(z * .22 + t * .9 + 1.3) * .3 + Math.sin((x + z) * .45 + t * 1.6) * .12;
}

// Wander: the person walks between random spots on the island, steering around the tower
const OBST = [[0, 0, .6], [1.05, .9, .5], [-1.1, -.8, .4]].concat(CITY.map(([x, z, w]) => [x, z, w * .71 + .12]));   // x, z, keep-out radius (tower and side block)
function segClear(ax, az, bx, bz) {
  for (const [ox, oz, r] of OBST) {
    if (Math.hypot(ax - ox, az - oz) < r) continue;          // already inside this keep-out zone: let the person walk out
    const dx = bx - ax, dz = bz - az, l = dx * dx + dz * dz || 1;
    const u = Math.max(0, Math.min(1, ((ox - ax) * dx + (oz - az) * dz) / l));
    if (Math.hypot(ax + dx * u - ox, az + dz * u - oz) < r) return false;
  }
  return true;
}
function walkPerson(w, dt, t) {
  const p = w.mesh.position;
  const dx = w.target.x - p.x, dz = w.target.z - p.z, d = Math.hypot(dx, dz);
  if (d < .05) {                        // arrived: pause, then choose a new spot
    p.y = H;
    w.wait -= dt;
    if (w.wait <= 0) {
      for (let k = 0; k < 20; k++) {
        const x = (Math.random() * 2 - 1) * 1.5, z = (Math.random() * 2 - 1) * 1.5;
        if (Math.hypot(x, z) < 1.5 && OBST.every(([ox, oz, r]) => Math.hypot(x - ox, z - oz) > r) && segClear(p.x, p.z, x, z)) { w.target.set(x, H, z); break; }
      }
      w.wait = .5 + Math.random() * 1.5;
    }
    return;
  }
  const step = Math.min(d, .5 * dt);     // walking speed
  p.x += dx / d * step; p.z += dz / d * step;
  p.y = H + Math.abs(Math.sin(t * 10)) * .03;   // little steps
  let da = Math.atan2(dx, dz) - w.mesh.rotation.y;
  da = Math.atan2(Math.sin(da), Math.cos(da));  // shortest turn
  w.mesh.rotation.y += da * Math.min(1, dt * 8);
}

const clock = new THREE.Clock();
const tmpV = new THREE.Vector3(), dirV = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;

  // Ocean waves (flat shading means no normal recompute is needed)
  for (let i = 0; i < oceanPos.count; i++) {
    const x = oceanPos.getX(i), z = oceanPos.getZ(i);
    oceanPos.setY(i, waveH(x, z, t));
  }
  oceanPos.needsUpdate = true;

  // Hover test only when the pointer moved
  if (pointerDirty) {
    pointerDirty = false;
    hovered = pick();
    canvas.style.cursor = hovered >= 0 ? 'pointer' : 'grab';
  }
  // LERP elevation + emissive glow
  islands.forEach((o, i) => {
    const isHot = i === hovered || i === selected;
    o.lift += ((isHot ? .35 : 0) - o.lift) * Math.min(1, dt * 8);
    o.emi  += ((isHot ? .7 : .1) - o.emi)  * Math.min(1, dt * 8);
    o.group.position.y = .6 + o.lift + waveH(o.group.position.x + world.position.x, o.group.position.z + world.position.z, t) * .5;   // islands ride the swell
    o.body.material.emissiveIntensity = o.emi;
    for (const book of (o.group.userData.books || [])) {                                                  // the book hovers, tilted toward the viewer, and sways
      book.position.y = H + .6 + Math.sin(t * 1.5) * .05;
      book.rotation.y = .6 + Math.sin(t * .6) * .5;
      book.rotation.x = .45;
    }
    for (const a of (o.group.userData.idle || [])) a.rotation.y = a.userData.baseRot + Math.sin(t * .7 + a.userData.phase) * .18;   // animals sway slowly
    const flag = o.group.userData.flag;
    if (flag) {                                                  // flag ripples in the wind
      const fp = flag.attributes.position;
      for (let k = 0; k < fp.count; k++) { const fx = fp.getX(k); fp.setZ(k, Math.sin(fx * 5 - t * 4) * .07 * (fx / 1.2)); }
      fp.needsUpdate = true;
    }
    const person = o.group.userData.person;
    if (person) walkPerson(person, dt, t);
    const bus = o.group.userData.bus;
    if (bus) {
      const u = (t * .08) % 1;
      bus.curve.getPointAt(u, tmpV); bus.curve.getPointAt((u + .01) % 1, dirV);
      bus.mesh.position.set(tmpV.x, H + .16, tmpV.z); bus.mesh.lookAt(dirV.x + o.group.position.x, H + .16 + o.group.position.y, dirV.z + o.group.position.z);
    }
  });

  // Bridges follow both islands as they bob, tilting to match the height difference
  bridges.forEach(({ br, a, b, hl }) => {
    const ay = a.position.y + H * a.scale.y - .02, by = b.position.y + H * b.scale.y - .02;   // island top heights
    br.position.set((a.position.x + b.position.x) / 2, (ay + by) / 2, (a.position.z + b.position.z) / 2);
    br.rotation.y = Math.atan2(b.position.x - a.position.x, b.position.z - a.position.z);
    br.rotation.x = -Math.atan2(by - ay, hl);
  });

  // Smooth camera focus: LERP target and camera distance
  if (focus.active) {
    controls.target.lerp(focus.target, .06);
    dirV.copy(camera.position).sub(controls.target).normalize().multiplyScalar(focus.dist);
    camera.position.lerp(tmpV.copy(controls.target).add(dirV), .05);
    if (controls.target.distanceTo(focus.target) < .02) focus.active = false;
  }

  // Collaboration pulses
  if (linesGroup.visible) pulses.forEach(p => p.pulse.position.copy(p.curve.getPointAt((t * .25 + p.offset) % 1)));

  // Day/night
  if (autoInput.checked) { phase = (phase + dt / 45) % 1; timeInput.value = phase.toFixed(3); }
  applyTime(phase);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
